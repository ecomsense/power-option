<!DOCTYPE html>
<html>

<head>
  <title>Option Dashboard</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <link rel="icon" href="data:;base64,ivBORw0KGgo=">
</head>

<body>
  <div class="dashboard-container">
    <div id="chart-container"></div>

    <div class="controls">
      <input type="number" id="base-strike" placeholder="Enter Base Strike (e.g. 25000)">
      <button onclick="updateStrikes()">Update Dashboard</button>
      <div id="strike-selection"></div>

      <div class="action-buttons">
        <button class="fire-btn" onclick="fireOrders()">FIRE</button>
        <button class="close-btn" onclick="closeAll()">CLOSE ALL</button>
        <button class="hedge-btn" onclick="fireHedge()">HEDGE</button>
      </div>
    </div>

    <div id="mtm-display">Current MTM: <span id="mtm-value">0.00</span></div>
  </div>
  <script src="/static/dashboard.js"></script>
</body>

</html>
