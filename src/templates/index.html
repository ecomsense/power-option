<!doctype html>
<html lang="en">
    <head>
        <title>Power Option</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.development.js"></script>
    </head>
    <body>
        <div class="dashboard-container">
            <div class="tables-wrapper">
                <div class="table-container diff-table-container">
                    <div class="top-control-bar">
                        <select
                            id="symbol-select"
                            onchange="updateExpiryDropdown()"
                        >
                            {% for symbol in symbols %}
                            <option value="{{ symbol }}">{{ symbol }}</option>
                            {% endfor %}
                        </select>
                        <select 
                            id="expiry-select"
                            name="expiry-select"
                            onchange="updateStrikeDropdowns()"
                        ></select>
                        <label for="main-call-base">C</label>
                        <select
                            id="main-call-base"
                            name="main-call-base"
                        ></select>
                        <label for="main-put-base">P</label>
                        <select
                            id="main-put-base"
                            name="main-put-base"
                        ></select>
                        <input
                            id="main-num"
                            class="text2"
                            type="number"
                            placeholder="No. of Strikes"
                            value="10"
                        />
                        <button
                            class="btn"
                            onclick="updateSubscription('main')"
                        >
                            update
                        </button>
                        <label for="main-qty">Lots</label>
                        <input
                            id="main-qty"
                            class="text2"
                            type="number"
                            value="1"
                        />
                        <button
                            id="main-side-toggle"
                            class="btn side-btn buy-mode"
                            onclick="toggleSide('diff')"
                        >
                            B
                        </button>
                        <button class="btn violet-btn" onclick="diffFire()">
                            Fire
                        </button>
                        <button class="btn orange-btn" onclick="diffSquare()">
                            Square
                        </button>
                    </div>
                    <table id="diffTable">
                        <thead>
                            <tr>
                                <th class="cb-cell"><input type="checkbox" id="diff-ce-checkall" onchange="toggleColumn('diffTable', 0, this.checked)"></th>
                                <th>Total Diff</th>
                                <th>CE %</th>
                                <th>CE Diff</th>
                                <th>CE LTP</th>
                                <th>Prev CE</th>
                                <th>CE Strike</th>
                                <th>PE Strike</th>
                                <th>Prev PE</th>
                                <th>PE LTP</th>
                                <th>PE Diff</th>
                                <th>PE %</th>
                                <th>Total %</th>
                                <th class="cb-cell"><input type="checkbox" id="diff-pe-checkall" onchange="toggleColumn('diffTable', 13, this.checked)"></th>
                            </tr>
                        </thead>
                        <tbody id="diffBody"></tbody>
                    </table>
                </div>

                <div class="table-container ltp-table-container">
                    <div class="top-control-bar">
                        <label for="hedge-call-base">C</label>
                        <select
                            id="hedge-call-base"
                            name="hedge-call-base"
                        ></select>
                        <label for="hedge-put-base">P</label>
                        <select
                            id="hedge-put-base"
                            name="hedge-put-base"
                        ></select>
                        <input
                            id="hedge-num"
                            class="text2"
                            type="number"
                            placeholder="No. of Strikes"
                            value="10"
                        />
                        <button
                            class="btn"
                            onclick="updateSubscription('hedge')"
                        >
                            update
                        </button>
                        <label for="hedge-qty">Lots</label>
                        <input
                            id="hedge-qty"
                            class="text2"
                            type="number"
                            value="10"
                        />
                        <button
                            id="hedge-side-toggle"
                            class="btn side-btn buy-mode"
                            onclick="toggleSide('hedge')"
                        >
                            B
                        </button>
                        <button class="btn violet-btn" onclick="hedgeFire()">
                            Hedge
                        </button>
                        <button class="btn orange-btn" onclick="hedgeSquare()">
                            Square
                        </button>
                        <button class="btn" onclick="showLogsModal()">logs</button>
                    </div>

                    <table id="hedgeTable">
                        <thead>
                            <tr>
                                <th class="cb-cell"><input type="checkbox" id="hedge-ce-checkall" onchange="toggleColumn('hedgeTable', 0, this.checked)"></th>
                                <th>CE LTP</th>
                                <th>CE Strike</th>
                                <th>PE Strike</th>
                                <th>PE LTP</th>
                                <th class="cb-cell"><input type="checkbox" id="hedge-pe-checkall" onchange="toggleColumn('hedgeTable', 5, this.checked)"></th>
                            </tr>
                        </thead>
                        <tbody id="hedgeBody"></tbody>
                    </table>
                </div>
            </div>

            <div id="chart-section">
                <div id="chart-container"></div>
            </div>
        </div>

        <div id="logsModal" class="modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:9999;">
            <div style="background:#222;margin:5% auto;padding:20px;width:80%;max-height:80%;overflow:auto;border-radius:8px;">
                <h2 style="color:#fff">Logs <button onclick="closeLogsModal()" style="float:right;background:#f44336;color:#fff;border:none;padding:5px 15px;cursor:pointer;">X</button></h2>
                <pre id="logsContent" style="color:#0f0;background:#111;padding:15px;overflow:auto;max-height:60vh;white-space:pre-wrap;word-wrap:break-word;"></pre>
            </div>
        </div>
        <link rel="stylesheet" href="/static/style.css" />
        <script src="/static/toggle.js"></script>
        <script src="/static/dashboard.js"></script>
        <script src="/static/dropdown.js"></script>
    </body>
</html>
