<!DOCTYPE html>
<html lang="en">

<head>
  <title>Option Dashboard</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/style.css">
  <script
    src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.development.js"></script>
</head>

<body>
  <div class="dashboard-container">
    <div id="controls-section">
      <div class="top-control-bar">
        <select id="symbol-select">
          <option value="NIFTY">NIFTY</option>
          <option value="BANKNIFTY">BANKNIFTY</option>
          <option value="SENSEX">SENSEX</option>
          <option value="FINNIFTY">FINNIFTY</option>
        </select>
        <input type="number" id="base-strike" placeholder="Base Strike" value="26100">
        <input type="number" id="num-strikes" placeholder="No. of Strikes" value="10">
        <button class="btn" onclick="updateStrikes()">Update</button>
        <button id="side-toggle" class="btn side-btn buy-mode" onclick="toggleSide()">BUY</button>
        <button class="btn fire-btn" onclick="fireOrders()">Fire</button>
        <button class="btn hedge-btn" onclick="fireHedge()">Hedge</button>
      </div>

      <div class="tables-wrapper">
        <div class="table-container diff-table-container">
          <table id="diffTable">
            <thead>
              <tr>
                <th class="cb-cell">CE</th>
                <th>Total Diff</th>
                <th>CE %</th>
                <th>CE Diff</th>
                <th>CE LTP</th>
                <th>Prev CE</th>
                <th class="strike-cell">CE Strike</th>
                <th class="strike-cell">PE Strike</th>
                <th>Prev PE</th>
                <th>PE LTP</th>
                <th>PE Diff</th>
                <th>PE %</th>
                <th>Total %</th>
                <th class="cb-cell">PE</th>
              </tr>
            </thead>
            <tbody id="diffBody"></tbody>
          </table>
        </div>

        <div class="table-container ltp-table-container">
          <table id="ltpTable">
            <thead>
              <tr>
                <th class="cb-cell">CE</th>
                <th>Total Diff</th>
                <th>CE %</th>
                <th>CE Diff</th>
                <th>CE LTP</th>
                <th>Prev CE</th>
                <th class="strike-cell">CE Strike</th>
                <th class="strike-cell">PE Strike</th>
                <th>Prev PE</th>
                <th>PE LTP</th>
                <th>PE Diff</th>
                <th>PE %</th>
                <th>Total %</th>
                <th class="cb-cell">PE</th>
              </tr>
            </thead>
            <tbody id="ltpBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="chart-section">
      <div id="chart-container"></div>
    </div>
  </div>
  <script src="/static/dashboard.js"></script>
</body>

</html>v id="chart-section">

</div>
</div>

</div>

</body>

</html>
