<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <title>Power Option</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="/static/style.css" />
        <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.development.js"></script>
        <style>
            :root {
                --bg-gradient: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
                --header-bg: rgba(0,0,0,0.3);
                --card-bg: rgba(255,255,255,0.05);
                --accent-green: #00ff88;
                --accent-red: #ff4757;
                --accent-blue: #00d9ff;
                --text-muted: #6b7280;
            }
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                background: var(--bg-gradient);
                color: #eaeaea;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }
            .app-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 1rem 2rem;
                background: var(--header-bg);
            }
            .header-left { display: flex; align-items: center; gap: 0.5rem; }
            .logo { font-size: 1.5rem; }
            .title { font-size: 1.25rem; font-weight: 600; }
            .header-right { display: flex; gap: 0.5rem; }
            .icon-btn {
                background: rgba(255,255,255,0.1);
                border: none;
                padding: 0.5rem;
                border-radius: 8px;
                cursor: pointer;
                font-size: 1.2rem;
                transition: all 0.2s;
            }
            .icon-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.05); }
        </style>
    </head>
    <body>
        <header class="app-header">
            <div class="header-left">
                <span class="logo">⚡</span>
                <span class="title">Power Option</span>
            </div>
            <div class="header-right">
                <button class="icon-btn" onclick="openSettingsModal()">⚙️</button>
                <button class="icon-btn" onclick="restartLogic()">🔄</button>
                <button class="icon-btn" onclick="openLogsModal()">📋</button>
            </div>
        </header>
        <div id="trading-status-banner" class="trading-status-banner" style="display: none;">
            <span id="trading-status-text"></span>
            <span id="trading-countdown"></span>
        </div>
        <div class="dashboard-container" id="dashboard-container">
            <div class="tables-wrapper" id="tables-wrapper">
                <div class="table-container">
                    <div class="top-control-bar">
                        <table class="control-table">
                            <tr class="label-row">
                                <th>Symbol</th>
                                <th>Expiry</th>
                                <th>Call</th>
                                <th>Put</th>
                                <th>Strikes</th>
                                <th>Qty</th>
                                <th>Mode</th>
                                <th class="actions-label">Actions</th>
                            </tr>
                            <tr class="control-row">
                                <td>
                                    <select id="symbol-select" onchange="updateExpiryDropdown()">
                                        {% for symbol in symbols %}
                                        <option value="{{ symbol }}">{{ symbol }}</option>
                                        {% endfor %}
                                    </select>
                                </td>
                                <td>
                                    <select id="expiry-select" name="expiry-select" onchange="updateStrikeDropdowns()"></select>
                                </td>
                                <td>
                                    <select id="main-call-base" name="main-call-base"></select>
                                </td>
                                <td>
                                    <select id="main-put-base" name="main-put-base"></select>
                                </td>
                                <td>
                                    <input id="main-num" class="qty" type="number" value="10" min="1" />
                                </td>
                                <td>
                                    <input id="main-qty" class="qty" type="number" value="1" min="1" />
                                </td>
                                <td>
                                    <label class="toggle-switch">
                                        <input type="checkbox" id="main-side-toggle" onchange="toggleSide('main')">
                                        <span class="slider">
                                            <span class="label buy">B</span>
                                            <span class="label sell">S</span>
                                        </span>
                                    </label>
                                </td>
                                <td class="actions-cell">
                                    <button class="btn" onclick="updateSubscription('main')">update</button>
                                    <button class="btn violet-btn action-btn" onclick="mainFire()">fire</button>
                                    <button class="btn orange-btn action-btn" onclick="mainSquare()">square</button>
                                </td>
                            </tr>
                        </table>
                    </div>
                    <div class="data-tables">
                        <table id="mainTable">
                            <thead>
                                <tr>
                                    <th class="cb-cell"><input type="checkbox" id="main-ce-checkall" onchange="toggleColumn('mainTable', 0, this.checked)"></th>
                                    <th>Total Diff</th>
                                    <th>CE %</th>
                                    <th>CE Diff</th>
                                    <th>CE LTP</th>
                                    <th>Prev CE</th>
                                    <th>CE Strike</th>
                                    <th>PE Strike</th>
                                    <th>Prev PE</th>
                                    <th>PE LTP</th>
                                    <th>PE Diff</th>
                                    <th>PE %</th>
                                    <th>Total %</th>
                                    <th class="cb-cell"><input type="checkbox" id="main-pe-checkall" onchange="toggleColumn('mainTable', 13, this.checked)"></th>
                                </tr>
                            </thead>
                            <tbody id="mainBody"></tbody>
                        </table>
                    </div>
                </div>

                <div class="table-container">
                    <div class="top-control-bar">
                        <table class="control-table">
                            <tr class="label-row">
                                <th>Call</th>
                                <th>Put</th>
                                <th>Strikes</th>
                                <th>Qty</th>
                                <th>Mode</th>
                                <th class="actions-label">Actions</th>
                                <th>Status</th>
                            </tr>
                            <tr class="control-row">
                                <td>
                                    <select id="hedge-call-base" name="hedge-call-base"></select>
                                </td>
                                <td>
                                    <select id="hedge-put-base" name="hedge-put-base"></select>
                                </td>
                                <td>
                                    <input id="hedge-num" class="qty" type="number" value="10" min="1" />
                                </td>
                                <td>
                                    <input id="hedge-qty" class="qty" type="number" value="10" min="1" />
                                </td>
                                <td>
                                    <label class="toggle-switch">
                                        <input type="checkbox" id="hedge-side-toggle" onchange="toggleSide('hedge')">
                                        <span class="slider">
                                            <span class="label buy">B</span>
                                            <span class="label sell">S</span>
                                        </span>
                                    </label>
                                </td>
                                <td class="actions-cell">
                                    <button class="btn" onclick="updateSubscription('hedge')">update</button>
                                    <button class="btn violet-btn action-btn" onclick="hedgeFire()">hedge</button>
                                    <button class="btn orange-btn action-btn" onclick="hedgeSquare()">square</button>
                                    <button class="btn" onclick="showLogsModal()">logs</button>
                                </td>
                                <td id="ws-status" class="ws-status connected ws-status-col">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M12 2v10M18 8a6 6 0 0 1-12 0M8 2v6M16 2v6M12 14v8"/>
                                        <line x1="1" y1="1" x2="23" y2="23" stroke="red" class="disconnected-line"/>
                                    </svg>
                                </td>
                            </tr>
                        </table>
                    </div>
                    <div class="data-tables">
                        <table id="hedgeTable">
                            <thead>
                                <tr>
                                    <th class="cb-cell"><input type="checkbox" id="hedge-ce-checkall" onchange="toggleColumn('hedgeTable', 0, this.checked)"></th>
                                    <th>CE LTP</th>
                                    <th>CE Strike</th>
                                    <th>PE Strike</th>
                                    <th>PE LTP</th>
                                    <th class="cb-cell"><input type="checkbox" id="hedge-pe-checkall" onchange="toggleColumn('hedgeTable', 5, this.checked)"></th>
                                </tr>
                            </thead>
                            <tbody id="hedgeBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div id="chart-section">
                <div id="resize-handle"></div>
                <div id="chart-container"></div>
            </div>
        </div>

        <div id="settingsModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <span>⚙️ Settings</span>
                    <button class="modal-close" onclick="closeSettingsModal()">×</button>
                </div>
                <form id="settingsForm">
                    <div class="form-group">
                        <label>Webhook URL:</label>
                        <input type="text" id="settingsWebhook" class="settings-input">
                    </div>
                    <div class="form-group">
                        <label>Tag:</label>
                        <input type="text" id="settingsTag" class="settings-input">
                    </div>
                    <div class="form-group">
                        <label>Timeout:</label>
                        <input type="number" id="settingsTimeout" class="settings-input">
                    </div>
                    <div class="form-actions">
                        <button type="button" class="icon-btn" onclick="saveSettings()">Save & Restart</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="logsModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <span>📋 Logs</span>
                    <button class="modal-close" onclick="closeLogsModal()">×</button>
                </div>
                <pre id="logsContent" class="log-content">Loading...</pre>
                <button class="icon-btn" onclick="refreshLogs()" style="margin-top: 1rem;">Refresh</button>
            </div>
        </div>

        <footer class="app-footer">
            Made with ❤️ by <a href="https://ecomsense.in">ecomsense.in</a>
        </footer>
        <script src="/static/toggle.js"></script>
        <script src="/static/dashboard.js"></script>
        <script src="/static/dropdown.js"></script>
        <script>
        async function restartLogic() {
            await fetch('/api/logic/stop', {method:'POST'});
            await new Promise(r => setTimeout(r, 500));
            await fetch('/api/logic/start', {method:'POST'});
            location.reload();
        }
        
        function openSettingsModal() {
            loadSettings();
            document.getElementById('settingsModal').style.display = 'flex';
        }
        
        function closeSettingsModal() {
            document.getElementById('settingsModal').style.display = 'none';
        }
        
        async function loadSettings() {
            try {
                const resp = await fetch('/api/logic/settings');
                const data = await resp.json();
                document.getElementById('settingsWebhook').value = data.webhook_url || '';
                document.getElementById('settingsTag').value = data.tag || 'poweroption';
                document.getElementById('settingsTimeout').value = data.timeout || 30;
            } catch(e) { console.error(e); }
        }
        
        async function saveSettings() {
            const payload = {
                webhook_url: document.getElementById('settingsWebhook').value,
                tag: document.getElementById('settingsTag').value,
                timeout: parseInt(document.getElementById('settingsTimeout').value),
            };
            try {
                await fetch('/api/logic/settings', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload),
                });
                closeSettingsModal();
                restartLogic();
            } catch(e) { console.error(e); }
        }
        
        function openLogsModal() {
            document.getElementById('logsModal').style.display = 'flex';
            refreshLogs();
        }
        
        function closeLogsModal() {
            document.getElementById('logsModal').style.display = 'none';
        }
        
        async function refreshLogs() {
            try {
                const resp = await fetch('/logs');
                document.getElementById('logsContent').textContent = await resp.text();
            } catch(e) {
                document.getElementById('logsContent').textContent = 'Error loading logs';
            }
        }
        
        // Update checkbox IDs from diffTable to mainTable for consistency
        function updateCheckAllState(tableId, colIndex) {
            if (tableId === 'diffTable') tableId = 'mainTable';
            const table = document.getElementById(tableId);
            if (!table) return;
            const rows = table.querySelectorAll("tbody tr:not(.footer-row)");
            let allChecked = true;
            rows.forEach(row => {
                const cell = row.children[colIndex];
                const checkbox = cell?.querySelector("input[type='checkbox']");
                if (checkbox && !checkbox.checked) allChecked = false;
            });
            const checkallId = tableId === 'mainTable' 
                ? (colIndex === 0 ? 'main-ce-checkall' : 'main-pe-checkall')
                : (colIndex === 0 ? 'hedge-ce-checkall' : 'hedge-pe-checkall');
            const checkall = document.getElementById(checkallId);
            if (checkall) checkall.checked = allChecked;
        }
        </script>
    </body>
</html>
