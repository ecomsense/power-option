<!doctype html>
<html lang="en">
    <head>
        <title>Power Option</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.development.js"></script>
    </head>
    <body>
        <div class="dashboard-container">
            <div class="tables-wrapper">
                <div class="table-container diff-table-container">
                    <div class="top-control-bar">
                        <table class="control-table">
<tr class="label-row">
                                <td>Symbol</td>
                                <td>Expiry</td>
                                <td>Call</td>
                                <td>Put</td>
                                <td>Strikes</td>
                                <td>Qty</td>
                                <td>Mode</td>
                                <td class="actions-label">Actions</td>
                            </tr>
                            <tr class="control-row">
                                <td>
                                    <select id="symbol-select" onchange="updateExpiryDropdown()">
                                        {% for symbol in symbols %}
                                        <option value="{{ symbol }}">{{ symbol }}</option>
                                        {% endfor %}
                                    </select>
                                </td>
                                <td>
                                    <select id="expiry-select" name="expiry-select" onchange="updateStrikeDropdowns()"></select>
                                </td>
                                <td>
                                    <select id="main-call-base" name="main-call-base"></select>
                                </td>
                                <td>
                                    <select id="main-put-base" name="main-put-base"></select>
                                </td>
                                <td>
                                    <input id="main-num" class="text2" type="number" value="10" />
                                </td>
                                <td>
                                    <input id="main-qty" class="text2" type="number" value="1" />
                                </td>
                                <td>
                                    <label class="toggle-switch">
                                        <input type="checkbox" id="main-side-toggle" onchange="toggleSide('diff')">
                                        <span class="slider">
                                            <span class="label buy">buy</span>
                                            <span class="label sell">sell</span>
                                        </span>
                                    </label>
                                </td>
                                <td class="actions-cell">
                                    <button class="btn" onclick="updateSubscription('main')">update</button>
                                    <button class="btn violet-btn" onclick="diffFire()">Fire</button>
                                    <button class="btn orange-btn" onclick="diffSquare()">Square</button>
                                </td>
                            </tr>
                        </table>
                    </div>
                    <table id="diffTable">
                        <thead>
                            <tr>
                                <th class="cb-cell"><input type="checkbox" id="diff-ce-checkall" onchange="toggleColumn('diffTable', 0, this.checked)"></th>
                                <th>Total Diff</th>
                                <th>CE %</th>
                                <th>CE Diff</th>
                                <th>CE LTP</th>
                                <th>Prev CE</th>
                                <th>CE Strike</th>
                                <th>PE Strike</th>
                                <th>Prev PE</th>
                                <th>PE LTP</th>
                                <th>PE Diff</th>
                                <th>PE %</th>
                                <th>Total %</th>
                                <th class="cb-cell"><input type="checkbox" id="diff-pe-checkall" onchange="toggleColumn('diffTable', 13, this.checked)"></th>
                            </tr>
                        </thead>
                        <tbody id="diffBody"></tbody>
                    </table>
                </div>

                <div class="table-container ltp-table-container">
                    <div class="top-control-bar">
                        <table class="control-table">
                            <tr class="label-row">
                                <td>Call</td>
                                <td>Put</td>
                                <td>Strikes</td>
                                <td>Qty</td>
                                <td>Mode</td>
                                <td class="actions-label">Actions</td>
                            </tr>
                            <tr class="control-row">
                                <td>
                                    <select id="hedge-call-base" name="hedge-call-base"></select>
                                </td>
                                <td>
                                    <select id="hedge-put-base" name="hedge-put-base"></select>
                                </td>
                                <td>
                                    <input id="hedge-num" class="text2" type="number" value="10" />
                                </td>
                                <td>
                                    <input id="hedge-qty" class="text2" type="number" value="10" />
                                </td>
                                <td>
                                    <label class="toggle-switch">
                                        <input type="checkbox" id="hedge-side-toggle" onchange="toggleSide('hedge')">
                                        <span class="slider">
                                            <span class="label buy">buy</span>
                                            <span class="label sell">sell</span>
                                        </span>
                                    </label>
                                </td>
                                <td class="actions-cell">
                                    <button class="btn" onclick="updateSubscription('hedge')">update</button>
                                    <button class="btn violet-btn" onclick="hedgeFire()">Hedge</button>
                                    <button class="btn orange-btn" onclick="hedgeSquare()">Square</button>
                                    <button class="btn" onclick="showLogsModal()">logs</button>
                                </td>
                            </tr>
                        </table>
                    </div>

                    <table id="hedgeTable">
                        <thead>
                            <tr>
                                <th class="cb-cell"><input type="checkbox" id="hedge-ce-checkall" onchange="toggleColumn('hedgeTable', 0, this.checked)"></th>
                                <th>CE LTP</th>
                                <th>CE Strike</th>
                                <th>PE Strike</th>
                                <th>PE LTP</th>
                                <th class="cb-cell"><input type="checkbox" id="hedge-pe-checkall" onchange="toggleColumn('hedgeTable', 5, this.checked)"></th>
                            </tr>
                        </thead>
                        <tbody id="hedgeBody"></tbody>
                    </table>
                </div>
                <div id="ws-status" class="ws-status disconnected">●</div>
            </div>

            <div id="chart-section">
                <div id="chart-container"></div>
            </div>
        </div>

        <div id="logsModal" class="modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:9999;">
            <div style="background:#222;margin:5% auto;padding:20px;width:80%;max-height:80%;overflow:auto;border-radius:8px;">
                <h2 style="color:#fff">Logs <button onclick="closeLogsModal()" style="float:right;background:#f44336;color:#fff;border:none;padding:5px 15px;cursor:pointer;">X</button></h2>
                <pre id="logsContent" style="color:#0f0;background:#111;padding:15px;overflow:auto;max-height:60vh;white-space:pre-wrap;word-wrap:break-word;"></pre>
            </div>
        </div>
        <link rel="stylesheet" href="/static/style.css" />
        <script src="/static/toggle.js"></script>
        <script src="/static/dashboard.js"></script>
        <script src="/static/dropdown.js"></script>
    </body>
</html>
