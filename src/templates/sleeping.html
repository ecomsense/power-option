<!doctype html>
<html lang='en' data-theme='dark'>
    <head>
        <title>Power Option - Sleeping</title>
        <meta charset='UTF-8' />
        <meta name='viewport' content='width=device-width, initial-scale=1.0' />
        <link rel='stylesheet' href='/static/style.css' />
        <style>
            .main-content {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 2rem;
                text-align: center;
            }
            .sleeping-emoji {
                font-size: 5rem;
                margin-bottom: 1rem;
                animation: float 3s ease-in-out infinite;
            }
            @keyframes float {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-20px); }
            }
            .sleeping-text {
                font-size: 2rem;
                font-weight: 700;
                margin-bottom: 1rem;
                color: var(--blue);
            }
            .quote {
                font-style: italic;
                color: var(--text-muted);
                margin-bottom: 2rem;
                max-width: 500px;
            }
            .schedule-card {
                background: var(--bg-card);
                border-radius: 12px;
                padding: 2rem;
                margin-bottom: 2rem;
                min-width: 300px;
            }
            .schedule-title {
                font-size: 1.25rem;
                font-weight: 600;
                margin-bottom: 1rem;
                color: var(--blue);
            }
            .countdown-time {
                font-size: 3rem;
                font-weight: 700;
                color: var(--blue);
                font-family: monospace;
                margin: 1rem 0;
            }
            .schedule-info {
                display: flex;
                gap: 1rem;
                justify-content: center;
                margin-top: 1rem;
            }
            .schedule-badge {
                background: rgba(255,255,255,0.1);
                padding: 0.5rem 1rem;
                border-radius: 8px;
                font-size: 0.9rem;
            }
            .schedule-badge.highlight {
                background: var(--green);
                color: var(--white);
            }
            .trading-days {
                display: flex;
                gap: 0.5rem;
                justify-content: center;
                margin-top: 1rem;
            }
            .day-badge {
                padding: 0.5rem;
                border-radius: 8px;
                background: rgba(255,255,255,0.05);
                font-size: 0.8rem;
                min-width: 45px;
            }
            .day-badge.active {
                background: var(--blue);
                color: var(--white);
            }
        </style>
    </head>
    <body>
        <header class='app-header'>
            <div class='header-left'>
                <span class='logo'>⚡</span>
                <span class='title title-btn'>Power Option</span>
            </div>
            <div class='header-right'>
                <button class='icon-btn' onclick='openSettingsModal()' title='Settings'>⚙️</button>
                <button class='icon-btn' onclick='openLogsModal()' title='Logs'>📋</button>
                <button class='icon-btn' onclick='toggleTheme()' id='themeToggle' title='Theme'>🌙</button>
            </div>
        </header>
        
        <div class='main-body'>
            <div class='sleeping-emoji' id='sleepingEmoji'>😴</div>
            <div class='sleeping-text' id='sleepingText'>Market Closed</div>
            <div class='quote' id='quoteText'>'Sleep is the best meditation.' - Dalai Lama</div>
            
            <div class='schedule-card'>
                <div class='schedule-title'>Market Schedule</div>
                <div class='countdown-time' id='countdownTime'>--:--:--</div>
                <div class='schedule-info'>
                    <span class='schedule-badge' id='opensTime'>Opens: --:--</span>
                    <span class='schedule-badge' id='closesTime'>Closes: --:--</span>
                </div>
                <div class='trading-days' id='tradingDaysContainer'></div>
            </div>
        </div>
        
        <div id='settingsModal' class='modal'>
            <div class='modal-content'>
                <div class='modal-header'>
                    <span>⚙️ Settings</span>
                    <button class='modal-close' onclick='closeSettingsModal()'>×</button>
                </div>
                <form id='settingsForm'>
                    <div class='form-group'>
                        <label>Webhook URL:</label>
                        <input type='text' id='webhookUrl' class='settings-input'>
                    </div>
                    <div class='form-group'>
                        <label>Tag:</label>
                        <input type='text' id='tag' class='settings-input'>
                    </div>
                    <div class='form-group'>
                        <label>Timeout (seconds):</label>
                        <input type='number' id='timeout' class='settings-input'>
                    </div>
                    <div class='form-actions'>
                        <button type='button' class='icon-btn' onclick='loadSettings()'>Load</button>
                        <button type='button' class='icon-btn' onclick='saveSettings()'>Save</button>
                    </div>
                </form>
            </div>
        </div>
        
        <div id='logsModal' class='modal'>
            <div class='modal-content'>
                <div class='modal-header'>
                    <span>📋 Logs</span>
                    <button class='modal-close' onclick='closeLogsModal()'>×</button>
                </div>
                <pre id='logContent' class='log-content'>Loading...</pre>
                <button class='icon-btn refresh-btn' onclick='refreshLogs()'>Refresh</button>
            </div>
        </div>
        
        <footer class='app-footer'>
            Made with ❤️ by <a href='https://ecomsense.in'>ecomsense.in</a>
        </footer>
        
        <script>
            const emojis = ['😴', '💤', '🥱', '😎', '☕', '🌙'];
            const quotes = [
                "Sleep is the best meditation. - Dalai Lama",
                "The stock market is designed to transfer money from the active to the patient. - Warren Buffett",
                "I will short the merge. - @pannet1",
                "Markets in a sea of randomness. - NIFTY Trader",
                "When the market is closed, the profits are preserved. - Unknown Trader",
            ];
            
            let emojiIndex = 0;
            let quoteIndex = 0;
            
            function rotateContent() {
                emojiIndex = (emojiIndex + 1) % emojis.length;
                quoteIndex = (quoteIndex + 1) % quotes.length;
                document.getElementById('sleepingEmoji').textContent = emojis[emojiIndex];
                document.getElementById('quoteText').textContent = quotes[quoteIndex];
            }
            
            setInterval(rotateContent, 8000);
            
            async function updateScheduleInfo() {
                try {
                    const resp = await fetch('/api/schedule');
                    const data = await resp.json();
                    console.log('Schedule data:', data);
                    
                    const [open, close] = (data.schedule_times || '--:-- - --:--').split(' - ');
                    document.getElementById('opensTime').textContent = 'Opens: ' + open;
                    document.getElementById('closesTime').textContent = 'Closes: ' + close;
                    
                    const daysMap = {Mon:0, Tue:1, Wed:2, Thu:3, Fri:4, Sat:5, Sun:6};
                    const today = new Date().getDay();
                    const daysEl = document.getElementById('tradingDaysContainer');
                    if (data.trading_days) {
                        daysEl.innerHTML = data.trading_days.map(d => 
                            '<span class=\"day-badge ' + (today === daysMap[d] ? 'active' : '') + '\">' + d + '</span>'
                        ).join('');
                    }
                    
                    if (data.within_schedule && data.running) {
                        window.location.href = '/';
                    } else if (data.within_schedule) {
                        document.getElementById('countdownTime').textContent = 'MARKET OPEN!';
                        document.getElementById('sleepingText').textContent = 'Market Open';
                        document.getElementById('sleepingEmoji').textContent = '🚀';
                    } else {
                        const now = new Date();
                        let nextOpen = new Date();
                        const [h, m] = (data.start_time || '09:14').split(':').map(Number);
                        nextOpen.setHours(h, m, 0, 0);
                        if (now > nextOpen) nextOpen.setDate(nextOpen.getDate() + 1);
                        while ([0, 6].includes(nextOpen.getDay())) nextOpen.setDate(nextOpen.getDate() + 1);
                        
                        const diff = nextOpen - now;
                        const hours = Math.floor(diff / (1000*60*60));
                        const mins = Math.floor((diff % (1000*60*60)) / (1000*60));
                        const secs = Math.floor((diff % (1000*60)) / 1000);
                        document.getElementById('countdownTime').textContent = 
                            String(hours).padStart(2,'0') + ':' + String(mins).padStart(2,'0') + ':' + String(secs).padStart(2,'0');
                    }
                } catch(e) {
                    console.error('Schedule error:', e);
                }
            }
            
            updateScheduleInfo();
            setInterval(updateScheduleInfo, 3000);
            
            function openSettingsModal() {
                document.getElementById('settingsModal').style.display = 'flex';
                loadSettings();
            }
            
            function closeSettingsModal() {
                document.getElementById('settingsModal').style.display = 'none';
            }
            
            async function loadSettings() {
                try {
                    const resp = await fetch('/api/logic/settings');
                    const data = await resp.json();
                    document.getElementById('webhookUrl').value = data.webhook_url || '';
                    document.getElementById('tag').value = data.tag || 'poweroption';
                    document.getElementById('timeout').value = data.timeout || 30;
                } catch(e) {
                    console.error('Load settings error:', e);
                }
            }
            
            async function saveSettings() {
                const payload = {
                    webhook_url: document.getElementById('webhookUrl').value,
                    tag: document.getElementById('tag').value,
                    timeout: parseInt(document.getElementById('timeout').value),
                };
                try {
                    await fetch('/api/logic/settings', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(payload),
                    });
                    closeSettingsModal();
                } catch(e) {
                    console.error('Save settings error:', e);
                }
            }
            
            function openLogsModal() {
                document.getElementById('logsModal').style.display = 'flex';
                refreshLogs();
            }
            
            function closeLogsModal() {
                document.getElementById('logsModal').style.display = 'none';
            }
            
            async function refreshLogs() {
                try {
                    const resp = await fetch('/logs');
                    const text = await resp.text();
                    document.getElementById('logContent').textContent = text;
                } catch(e) {
                    document.getElementById('logContent').textContent = 'Error loading logs';
                }
            }

            function toggleTheme() {
                const html = document.documentElement;
                const isDark = html.getAttribute('data-theme') === 'dark';
                html.setAttribute('data-theme', isDark ? 'light' : 'dark');
                localStorage.setItem('theme', isDark ? 'light' : 'dark');
                document.getElementById('themeToggle').textContent = isDark ? '☀️' : '🌙';
            }

            (function() {
                const saved = localStorage.getItem('theme');
                if (saved) document.documentElement.setAttribute('data-theme', saved);
                const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
                document.getElementById('themeToggle').textContent = isDark ? '🌙' : '☀️';
            })();
        </script>
    </body>
</html>
