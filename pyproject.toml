[project]
name = "power-option"
version = "1.0.0"
description = "Real-time option trading terminal for NIFTY/BANKNIFTY/FINNIFTY"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "jinja2>=3.1.0",
    "pendulum>=3.0.0",
    "httpx>=0.25.0",
    "pandas>=2.0.0",
    "kiteconnect>=4.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "apscheduler>=3.10.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "stock-brokers @ git+https://github.com/ecomsense/stock-brokers",
    "toolkit @ git+https://github.com/pannet1/toolkit",
    "pyotp>=2.9.0",
]

[tool.uv]
python-preference = "managed"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
